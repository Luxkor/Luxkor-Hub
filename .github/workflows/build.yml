name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: |
          windres app.rc -O coff -o app.res.o
          gcc -Os -s -mwindows -static -o LuxkorHub.exe luxkor_hub.c app.res.o -lwinhttp -lgdiplus -lgdi32 -luser32 -lshell32 -lshlwapi -ldwmapi
      - uses: actions/upload-artifact@v4
        with:
          name: LuxkorHub
          path: LuxkorHub.exe
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" LuxkorHub.exe --clobber
          else
            gh release create "$TAG" LuxkorHub.exe --title "Luxkor Hub $TAG" --generate-notes
          fi
