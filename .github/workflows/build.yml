name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: |
          windres app.rc -O coff -o app.res.o
          gcc -Os -s -mwindows -static -o LuxkorHub.exe luxkor_hub.c app.res.o -lwinhttp -lgdiplus -lgdi32 -luser32 -lshell32 -lshlwapi -ldwmapi
      - uses: actions/upload-artifact@v4
        with:
          name: LuxkorHub
          path: LuxkorHub.exe
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" LuxkorHub.exe --title "Luxkor Hub ${{ github.ref_name }}" --generate-notes
